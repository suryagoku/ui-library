name: Deploy Storybook

# Publishes the component documentation to GitHub Pages, so consumers of @suryagoku/ui have a
# browsable reference for what is on the default branch.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until that is set, this workflow fails at the deploy step with "Pages is not enabled".
on:
  push:
    branches: [main, master]
    paths:
      - "packages/ui/**"
      - "apps/docs/**"
      - "package.json"
      - ".github/workflows/deploy-storybook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # required by actions/deploy-pages for OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:storybook

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/storybook-static

      - id: deploy
        uses: actions/deploy-pages@v4
