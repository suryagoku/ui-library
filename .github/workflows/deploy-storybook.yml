name: Deploy Storybook

# Publishes the component documentation to GitHub Pages, so consumers of @suryagoku/ui have a
# browsable reference for what is on the default branch.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until that is set, this workflow fails at the deploy step with "Pages is not enabled".
#
# Triggered by release.yml completing on main (workflow_run), which gives this workflow its own
# default-branch context — the one GitHub Pages requires. A pull_request-context caller would
# be rejected with HTTP 403. workflow_dispatch covers the rare direct-push / recovery case.
#
# The deploy job's `if` guard mirrors the old `storybook` job condition in release.yml:
# skip the deploy whenever the release workflow itself failed, so Pages never advertises a
# version that was never actually published.
on:
  workflow_run:
    workflows: ["Release @suryagoku/ui"]
    types: [completed]
    # No `branches` filter here: that filter matches the PR's *head* branch (e.g. feat/my-thing),
    # never `main`, so it would silently suppress every trigger. release.yml is already
    # restricted to PRs that target main, so workflow_run only fires in that case anyway.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Defaults to the ref that triggered the run."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write # required by actions/deploy-pages for OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Pages
    # For workflow_run: only deploy if the release workflow succeeded (or had no release to do —
    # a skipped release job still yields conclusion=success for the overall workflow).
    # For workflow_dispatch: always run (manual/recovery trigger).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run: inputs.ref is empty, so fall back to the default branch (main).
          # This ensures the build reflects the tip of main, which by the time workflow_run
          # fires already includes the release commit pushed by release.yml.
          # For workflow_dispatch: use the caller-supplied ref, or default branch if blank.
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:storybook

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/storybook-static

      - id: deploy
        uses: actions/deploy-pages@v4
