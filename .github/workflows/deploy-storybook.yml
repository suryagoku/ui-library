name: Deploy Storybook

# Publishes the component documentation to GitHub Pages, so consumers of @suryagoku/ui have a
# browsable reference for what is on the default branch.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until that is set, this workflow fails at the deploy step with "Pages is not enabled".
#
# Called by release.yml after every merge rather than triggered by the push itself: a releasing
# merge produces two pushes (the merge, then the release commit), and triggering on both would
# deploy the same Storybook twice. workflow_dispatch covers the rare direct push to the branch.
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Defaults to the ref that triggered the run."
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Defaults to the ref that triggered the run."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write # required by actions/deploy-pages for OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty means "the triggering ref". The release workflow passes the default branch, so
          # the deploy reflects the tip after the release commit rather than the merge ref.
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:storybook

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/storybook-static

      - id: deploy
        uses: actions/deploy-pages@v4
